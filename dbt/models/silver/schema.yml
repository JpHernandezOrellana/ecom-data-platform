version: 2
models:
  - name: stg_orders
    description: Latest deterministic source version of one order_id.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: order_status
        tests:
          - accepted_values:
              values: [created, approved, processing, invoiced, shipped, delivered, unavailable, canceled]
      - name: reporting_date
        tests: [not_null]
  - name: mart_daily_order_fulfillment
    description: Certified metrics by Chilean purchase-date cohort.
    columns:
      - name: reporting_date
        tests: [not_null, unique]
  - name: stg_order_items
    description: Latest deterministic source version of one (order_id, order_item_id).
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
  - name: int_order_commerce
    description: One row per order_id with items pre-aggregated (ADR-005).
    columns:
      - name: order_id
        tests: [not_null, unique]
  - name: mart_daily_commerce
    description: Certified BRL commerce value by Chilean purchase-date cohort (ADR-005).
    columns:
      - name: reporting_date
        tests: [not_null, unique]
  - name: stg_order_payments
    description: Latest deterministic source version of one (order_id, payment_sequential).
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null]
  - name: int_payment_reconciliation
    description: >
      Diagnostic only (ADR-005): compares sum(payment_value) to price+freight_value per
      order. Disagreement is expected and documented; never used for GMV/AOV.
    columns:
      - name: order_id
        tests: [not_null, unique]
  - name: stg_order_refunds
    description: >
      Latest deterministic source version of one refund_id. Entirely synthetic demo data
      (ADR-005); never claimed as observed Olist history.
    columns:
      - name: refund_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
  - name: mart_daily_refunds
    description: >
      Certified synthetic refund activity by refund-date cohort (ADR-005). Never netted
      into mart_daily_commerce.gmv_brl.
    columns:
      - name: reporting_date
        tests: [not_null, unique]
  - name: stg_products
    description: >
      Latest deterministic source version of one product_id. A null category is bucketed
      as the literal "unknown" (ADR-008), never dropped.
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: stg_sellers
    description: Latest deterministic source version of one seller_id.
    columns:
      - name: seller_id
        tests: [not_null, unique]
  - name: int_order_items_category
    description: >
      One row per order_item carrying its product's category at item grain (ADR-008).
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
  - name: mart_daily_category_commerce
    description: >
      Certified BRL commerce value by Chilean purchase-date cohort and product category,
      at item grain (ADR-008). sum(category_gmv_brl) by date reconciles to
      mart_daily_commerce.gmv_brl.
    columns:
      - name: reporting_date
        tests: [not_null]
      - name: product_category_name
        tests: [not_null]
  - name: stg_customers
    description: >
      Latest deterministic source version of one customer_id. customer_id is the
      order-associated customer row, not the repeat-customer identity
      (customer_unique_id, SDD §9.4). No new-vs-returning-customer metric is defined here
      (deferred, ADR-008 "Deferred").
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]
