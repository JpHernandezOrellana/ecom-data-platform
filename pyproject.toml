[project]
name = "ecom-data-platform"
version = "0.1.0"
description = "Local-first e-commerce data platform (Phase 1: orders fulfillment)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.5",
  "pyarrow>=17.0.0",
  "pyyaml>=6.0.2",
  "python-dateutil>=2.9.0",
  "dbt-core>=1.7,<1.9",
  "dbt-postgres>=1.7,<1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires local Postgres via docker compose"]
