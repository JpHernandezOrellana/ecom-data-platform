contract_version: 1.0.0
status: accepted
accepted_by: Juan Pablo
accepted_date: 2026-10-05
related_sdd: SDD.md
related_adrs:
  - docs/adrs/ADR-005-commerce-metrics.md
dataset:
  name: operational_order_refunds
  owner: Juan Pablo
  producer: deterministic_refund_simulator
  source_type: postgresql_table
  relation: source.order_refunds
  grain: One row represents one synthetic refund event against one existing payment.
  primary_key:
    - refund_id
  currency_applicability: brl_only
  synthetic: true
  synthetic_disclosure: >
    This entire dataset is generated by a deterministic local simulator
    (ecom.generate_refunds), parallel to ecom.mutate. Olist contains no refund events.
    These rows must never be presented as observed Olist history, in this contract, in
    any mart built from it, or in any evidence document.
incremental_interface:
  cursor:
    - source_updated_at
    - refund_id
  ordering: lexicographic
  lower_boundary: exclusive
  upper_boundary: inclusive
  upper_boundary_source: Greatest cursor tuple in the stable source snapshot at run start.
  initial_boundary: No lower predicate when no checkpoint exists.
  null_cursor_behavior: Fail the entity before extraction.
  phase_2_concurrency: Simulator writes and extraction are serialized.
  overlap_window: disabled
  hard_delete_capture: unsupported
schema:
  - name: refund_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
    semantics: Deterministic hash of (order_id, payment_sequential, refunded_at).
  - name: order_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: payment_sequential
    postgresql_type: integer
    logical_type: integer
    required: true
    minimum: 1
  - name: refunded_amount
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: Must not exceed the referenced payment's payment_value (enforced by the generator).
  - name: refund_reason
    postgresql_type: text
    logical_type: string
    required: true
  - name: refunded_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    semantics: Synthetic event instant, generated directly in UTC (no source-timezone ambiguity).
  - name: source_created_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
  - name: source_updated_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
conditional_rules:
  - id: OP-REF-CURSOR-001
    severity: blocking
    rule: source_updated_at and refund_id are never null.
  - id: OP-REF-FK-001
    severity: blocking
    rule: (order_id, payment_sequential) must reference an existing source.order_payments row (enforced by a database foreign key).
  - id: OP-REF-MONEY-001
    severity: quarantine
    rule: refunded_amount is non-negative with at most two decimal places.
rejection_policy:
  evaluated_count: accepted_count + rejected_count
  maximum_rejected_rows: 10
  maximum_rejected_rate: 0.01
  on_threshold_exceeded: Fail extraction, preserve rejected rows, and do not advance the checkpoint.
freshness:
  cadence: daily_capable_and_manually_triggerable
  healthy_run_target_minutes: 15
classification:
  pii: none
  secrets: false
retention:
  operational_state: Current state for the local project lifetime.
  committed_bronze: Immutable for the local project lifetime.
compatibility:
  policy: backward
  breaking_changes:
    - change cursor semantics
    - change refund_id derivation
    - remove or rename a consumed column
consumers:
  - incremental_order_refunds_ingestion
known_limitations:
  - This is entirely synthetic demo data; it is not derived from or claimed to be
    observed Olist refund history, because Olist contains no such signal (ADR-005).
  - Hard deletes are not captured.
  - One refund per generator invocation; the generator does not model partial-refund
    sequences beyond what is explicitly generated.
