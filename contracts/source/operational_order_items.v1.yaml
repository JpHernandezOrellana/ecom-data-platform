contract_version: 1.0.0
status: accepted
accepted_by: Juan Pablo
accepted_date: 2026-10-04
related_sdd: SDD.md
related_adrs:
  - docs/adrs/ADR-005-commerce-metrics.md
  - docs/adrs/ADR-006-composite-entity-cursor.md
dataset:
  name: operational_order_items
  owner: Juan Pablo
  producer: deterministic_source_simulator
  source_type: postgresql_table
  relation: source.order_items
  grain: One row represents the latest operational state of one (order_id, order_item_id).
  primary_key:
    - order_id
    - order_item_id
  currency_applicability: brl_only
incremental_interface:
  cursor:
    - source_updated_at
    - source_cursor_key
  cursor_key_derivation: "source_cursor_key = order_id || ':' || lpad(order_item_id::text, 4, '0'), per ADR-006"
  ordering: lexicographic
  lower_boundary: exclusive
  upper_boundary: inclusive
  upper_boundary_source: Greatest cursor tuple in the stable source snapshot at run start.
  initial_boundary: No lower predicate when no checkpoint exists.
  null_cursor_behavior: Fail the entity before extraction.
  phase_2_concurrency: Simulator writes and extraction are serialized.
  overlap_window: disabled
  hard_delete_capture: unsupported
schema:
  - name: order_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: order_item_id
    postgresql_type: integer
    logical_type: integer
    required: true
    minimum: 1
  - name: source_cursor_key
    postgresql_type: text
    logical_type: string
    required: true
    source: generated_column
    semantics: Derived cursor-comparison key only (ADR-006); never a business key.
  - name: product_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: seller_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: shipping_limit_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
  - name: shipping_limit_at_source_text
    postgresql_type: text
    logical_type: string
    required: true
  - name: shipping_limit_at_timezone_resolution
    postgresql_type: text
    logical_type: string
    required: true
    allowed_values: [exact, ambiguous_fold_0, synthetic_aware]
  - name: price
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
  - name: freight_value
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
  - name: source_created_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
  - name: source_updated_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
conditional_rules:
  - id: OP-ITEM-PROV-001
    severity: quarantine
    rule: shipping_limit_at has non-null source text and timezone resolution.
  - id: OP-ITEM-CURSOR-001
    severity: blocking
    rule: source_updated_at, order_id, and order_item_id are never null.
  - id: OP-ITEM-CURSOR-002
    severity: blocking
    rule: Every mutation of an existing item sets source_updated_at strictly later than its previous value.
  - id: OP-ITEM-VERSION-001
    severity: blocking
    rule: One (order_id, order_item_id, source_updated_at) tuple cannot have conflicting payload hashes.
  - id: OP-ITEM-MONEY-001
    severity: quarantine
    rule: price and freight_value are non-negative with at most two decimal places.
rejection_policy:
  evaluated_count: accepted_count + rejected_count
  maximum_rejected_rows: 10
  maximum_rejected_rate: 0.01
  on_threshold_exceeded: Fail extraction, preserve rejected rows, and do not advance the checkpoint.
freshness:
  cadence: daily_capable_and_manually_triggerable
  healthy_run_target_minutes: 15
classification:
  pii: none
  secrets: false
retention:
  operational_state: Current state for the local project lifetime.
  committed_bronze: Immutable for the local project lifetime.
  quarantine: Immutable for the local project lifetime unless an explicit cleanup policy is accepted.
compatibility:
  policy: backward
  breaking_changes:
    - change cursor semantics or source_cursor_key derivation
    - change the (order_id, order_item_id) primary key semantics
    - remove or rename a consumed column
    - narrow a consumed type
    - change source timestamp meaning
consumers:
  - incremental_order_items_ingestion
known_limitations:
  - Hard deletes are not captured.
  - Concurrent simulator writes and extraction are unsupported.
  - source_cursor_key assumes order_item_id never exceeds 9999 for one order (ADR-006).
  - This contract does not enforce that order_id exists in source.orders; that check is a
    downstream Silver/intermediate-model concern, not an extraction-time blocking rule.
