contract_version: 1.0.0
status: accepted
accepted_by: Juan Pablo
accepted_date: 2026-10-05
related_sdd: SDD.md
dataset:
  name: operational_customers
  owner: Juan Pablo
  producer: deterministic_source_simulator
  source_type: postgresql_table
  relation: source.customers
  grain: One row represents the latest operational state of one customer_id.
  primary_key:
    - customer_id
  currency_applicability: not_applicable_no_monetary_fields
incremental_interface:
  cursor:
    - source_updated_at
    - customer_id
  ordering: lexicographic
  lower_boundary: exclusive
  upper_boundary: inclusive
  upper_boundary_source: Greatest cursor tuple in the stable source snapshot at run start.
  initial_boundary: No lower predicate when no checkpoint exists.
  null_cursor_behavior: Fail the entity before extraction.
  overlap_window: disabled
  hard_delete_capture: unsupported
schema:
  - name: customer_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: customer_unique_id
    postgresql_type: text
    logical_type: string
    required: true
    pattern: "^[0-9a-f]{32}$"
  - name: customer_zip_code_prefix
    postgresql_type: text
    logical_type: string
    required: true
  - name: customer_city
    postgresql_type: text
    logical_type: string
    required: true
  - name: customer_state
    postgresql_type: text
    logical_type: string
    required: true
  - name: source_created_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
  - name: source_updated_at
    postgresql_type: timestamptz
    logical_type: utc_instant
    required: true
    source: simulator_owned
conditional_rules:
  - id: OP-CUST-CURSOR-001
    severity: blocking
    rule: source_updated_at and customer_id are never null.
  - id: OP-CUST-CURSOR-002
    severity: blocking
    rule: Every mutation of an existing customer sets source_updated_at strictly later than its previous value.
  - id: OP-CUST-VERSION-001
    severity: blocking
    rule: One customer_id and source_updated_at tuple cannot have conflicting payload hashes.
rejection_policy:
  evaluated_count: accepted_count + rejected_count
  maximum_rejected_rows: 10
  maximum_rejected_rate: 0.01
  on_threshold_exceeded: Fail extraction, preserve rejected rows, and do not advance the checkpoint.
freshness:
  cadence: daily_capable_and_manually_triggerable
  healthy_run_target_minutes: 15
classification:
  pii: pseudonymous
  pii_fields:
    - customer_id
    - customer_unique_id
  secrets: false
retention:
  operational_state: Current state for the local project lifetime.
  committed_bronze: Immutable for the local project lifetime.
  quarantine: Immutable for the local project lifetime unless an explicit cleanup policy is accepted.
compatibility:
  policy: backward
  breaking_changes:
    - change cursor semantics
    - change customer_id or customer_unique_id semantics
    - remove or rename a consumed column
    - narrow a consumed type
consumers:
  - incremental_customers_ingestion
known_limitations:
  - Hard deletes are not captured.
  - No business timestamp exists in this source (ADR-008).
