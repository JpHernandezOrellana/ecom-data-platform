contract_version: 1.1.0
metric_version: 1.0.0
status: accepted
accepted_by: Juan Pablo
accepted_date: 2026-10-04
last_synchronized: 2026-10-06
related_sdd: SDD.md
related_adrs:
  - docs/adrs/ADR-005-commerce-metrics.md
  - docs/adrs/ADR-007-fx-brl-clp.md
data_product:
  name: mart_daily_commerce
  owner: Juan Pablo
  producer: phase_2a_dbt_project
  relation: gold.mart_daily_commerce
  grain: One row represents one order purchase-date cohort in America/Santiago.
  purpose: Certified BRL commerce value (GMV, freight, AOV) for orders grouped by Chilean purchase date, with an additive CLP translation of GMV (Phase 2D, ADR-007).
  primary_key:
    - reporting_date
  currency_applicability: brl_and_additive_clp
schema:
  - name: reporting_date
    postgresql_type: date
    logical_type: date
    required: true
    semantics: Same cohort date as mart_daily_order_fulfillment (purchase instant, Sao Paulo -> UTC -> Santiago).
  - name: eligible_order_count
    postgresql_type: bigint
    logical_type: integer
    required: true
    minimum: 0
    semantics: Distinct orders with at least one item, excluding canceled/unavailable (ADR-005).
  - name: gmv_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: sum(order_items.price) over eligible orders. Excludes freight.
  - name: freight_value_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: sum(order_items.freight_value) over eligible orders.
  - name: gross_order_value_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: gmv_brl + freight_value_brl. Never called "revenue".
  - name: aov_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: false
    minimum: 0
    semantics: gmv_brl / eligible_order_count. Null when eligible_order_count is zero.
  - name: canceled_item_value_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: sum(price) for items on orders whose latest status is canceled. Diagnostic only, excluded from gmv_brl.
  - name: unavailable_item_value_brl
    postgresql_type: numeric(18,2)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: sum(price) for items on orders whose latest status is unavailable. Diagnostic only, excluded from gmv_brl.
  - name: gmv_clp
    postgresql_type: bigint
    logical_type: integer
    required: true
    minimum: 0
    semantics: >
      gmv_brl converted to CLP via fx_rate_clp_per_brl, rounded half-up to the nearest
      peso (ADR-007). Additive; never replaces gmv_brl.
  - name: fx_rate_clp_per_brl
    postgresql_type: numeric(18,6)
    logical_type: decimal
    required: true
    minimum: 0
    semantics: >
      CLP per BRL cross-rate used for gmv_clp, derived via USD from BCB PTAX and SII
      Dolar Observado (ADR-007).
  - name: fx_rate_date
    postgresql_type: date
    logical_type: date
    required: true
    semantics: >
      The older (more carried-forward) of the two legs' actual rate dates. Equals
      reporting_date when both legs published same-day.
  - name: fx_rate_source
    postgresql_type: text
    logical_type: string
    required: true
    allowed_values: ["bcb_ptax+sii_dolar_observado"]
  - name: fx_rate_is_carried_forward
    postgresql_type: boolean
    logical_type: boolean
    required: true
    semantics: True when either leg's resolved rate_date differs from reporting_date.
metrics:
  canonical_glossary: docs/metrics.md
  included:
    - eligible_order_count
    - gmv_brl
    - freight_value_brl
    - gross_order_value_brl
    - aov_brl
    - canceled_item_value_brl
    - unavailable_item_value_brl
    - gmv_clp
quality_rules:
  - id: GOLD-COM-GRAIN-001
    severity: blocking
    rule: reporting_date is unique and non-null.
  - id: GOLD-COM-MONEY-001
    severity: blocking
    rule: gmv_brl, freight_value_brl, gross_order_value_brl, canceled_item_value_brl, and unavailable_item_value_brl are non-negative.
  - id: GOLD-COM-MONEY-002
    severity: blocking
    rule: gross_order_value_brl equals gmv_brl + freight_value_brl exactly.
  - id: GOLD-COM-AOV-001
    severity: blocking
    rule: aov_brl is null exactly when eligible_order_count is zero; otherwise it equals gmv_brl / eligible_order_count.
  - id: GOLD-COM-RECON-001
    severity: blocking
    rule: gmv_brl reconciles to sum(price) over eligible order items grouped by reporting_date in the Silver/intermediate layer.
  - id: GOLD-COM-ORPHAN-001
    severity: blocking
    rule: No order_item may reference an order_id absent from stg_orders (no silent loss, AGENTS.md 6.8); such rows fail the build rather than being silently excluded.
  - id: GOLD-COM-CLP-001
    severity: blocking
    rule: >
      gmv_clp is non-negative; fx_rate_clp_per_brl is positive; fx_rate_date is
      non-null; fx_rate_source equals "bcb_ptax+sii_dolar_observado" (ADR-007).
  - id: GOLD-COM-CLP-002
    severity: blocking
    rule: gmv_clp equals round(gmv_brl * fx_rate_clp_per_brl) exactly (half-up, ADR-007).
  - id: GOLD-COM-CLP-FAILCLOSED-001
    severity: blocking
    rule: >
      Every reporting_date present in this mart must resolve a cross-rate within the
      7-day carry-forward window on both legs (int_fx_cross_rate /
      assert_fx_rate_resolves_for_commerce_dates); a date that cannot resolve fails the
      build rather than publishing a null or zero gmv_clp.
freshness:
  cadence: daily_capable_and_manually_triggerable
  healthy_run_target_minutes: 15
publication:
  candidate_schema: gold_candidate
  candidate_relation_pattern: mart_daily_commerce__<publication_id>
  certified_relation: gold.mart_daily_commerce
  certified_relation_type: view
  promotion: Replace the stable view and record publication metadata in one warehouse transaction after all required tests pass.
  failed_candidate_behavior: Preserve the previously certified view target.
  retention:
    successful_candidates: 5
    failed_candidate_days: 7
classification:
  pii: none
  secrets: false
retention:
  certified_product: Retain the current certified view and its referenced candidate.
compatibility:
  policy: backward
  breaking_changes:
    - change grain or reporting date role
    - change a metric formula or eligibility rule
    - remove or rename a contracted field
    - include freight in gmv_brl
consumers:
  - analyst
  - portfolio_reviewer
known_limitations:
  - gmv_brl is gross of unobserved real-world refunds; synthetic demo refunds are reported
    separately in mart_daily_refunds (ADR-005), never netted here.
  - CLP is implemented for gmv_clp only in this slice; freight_value_clp,
    gross_order_value_clp, and aov_clp are deferred additive follow-ups (same pattern,
    not yet certified).
  - CLP figures are independently rounded per column; arithmetic identities that hold
    exactly in BRL (e.g. gross = gmv + freight) are not guaranteed to hold exactly for
    their CLP counterparts once more than one CLP column exists.
  - A date whose cross-rate cannot resolve within the 7-day carry-forward window fails the
    whole dbt build (ADR-007), not just this mart; see
    assert_fx_rate_resolves_for_commerce_dates.
  - An order_item referencing an order_id absent from stg_orders fails the dbt build
    (GOLD-COM-ORPHAN-001) rather than being quarantined row-by-row; recovering from this
    requires fixing upstream extraction/bootstrap ordering, not editing this mart.
